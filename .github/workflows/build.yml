name: Build iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.beyond --project-name beyond_admin .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Empacotar o IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr beyond.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: beyond-ios
          path: beyond.ipa
